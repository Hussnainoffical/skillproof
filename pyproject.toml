[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillproof"
version = "0.1.0"
description = "Local-first, evidence-linked qualification document review workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12,<1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
ocr = ["Pillow>=10,<13", "pytesseract>=0.3.13,<1", "PyMuPDF>=1.24,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
skillproof = "skillproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillproof = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
